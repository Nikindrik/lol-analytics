<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League of Legends - Live Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100vh; overflow: hidden; font-family: 'Segoe UI', Arial; background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%); color: #e0e0e0; }
        
        #header { position: fixed; top: 0; left: 0; right: 0; height: 70px; background: rgba(10, 14, 39, 0.95); border-bottom: 2px solid #0a5f96; display: flex; justify-content: space-between; align-items: center; padding: 0 30px; z-index: 100; }
        #header h1 { font-size: 20px; color: #0a9fff; }
        #gameTime { font-size: 24px; color: #00ff00; font-weight: 700; }
        
        #main { position: fixed; top: 70px; left: 0; right: 0; bottom: 0; display: grid; grid-template-rows: auto 1fr; gap: 0; overflow: hidden; }
        
        #topSection { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 15px; background: rgba(20, 25, 45, 0.8); border-bottom: 2px solid #0a5f96; }
        
        .card { background: rgba(10, 95, 150, 0.2); border: 1px solid #0a5f96; border-radius: 6px; padding: 12px; position: relative; }
        .card.enemy { border-color: #8b0000; background: rgba(139, 0, 0, 0.15); }
        
        .card h2 { font-size: 13px; color: #0a9fff; margin-bottom: 8px; }
        .card.enemy h2 { color: #ff4444; }
        
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; font-size: 11px; }
        .stat { background: rgba(0, 0, 0, 0.3); padding: 6px; border-radius: 3px; border: 1px solid #0a5f96; }
        .stat.enemy { border-color: #8b0000; }
        .stat label { color: #888; font-size: 9px; }
        .stat value { display: block; color: #00ffff; font-weight: 700; margin-top: 2px; }
        .stat.enemy value { color: #ff8888; }
        
        .playstyle-card {
            background: linear-gradient(135deg, rgba(10, 95, 150, 0.3), rgba(10, 159, 255, 0.1));
            border: 2px solid #0a9fff;
            border-radius: 8px;
            padding: 10px 15px;
            margin-top: 10px;
            text-align: center;
            box-shadow: 0 0 15px rgba(10, 159, 255, 0.3);
        }
        
        .playstyle-label {
            font-size: 10px;
            color: #0a9fff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        
        .playstyle-value {
            font-size: 18px;
            font-weight: 800;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
        
        .playstyle-confidence {
            font-size: 10px;
            color: #888;
            margin-top: 5px;
        }
        
        .playstyle-confidence span {
            color: #00ff00;
            font-weight: 700;
        }
        
        #chartsContainer { overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 12px; padding: 15px; background: rgba(20, 25, 45, 0.8); }
        
        .chart-box { background: rgba(10, 20, 40, 0.8); border: 1px solid #0a5f96; border-radius: 4px; padding: 12px; }
        .chart-box h3 { font-size: 12px; color: #0a9fff; margin-bottom: 8px; }
        .chart-box canvas { max-height: 200px; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
        ::-webkit-scrollbar-thumb { background: #0a5f96; border-radius: 3px; }
        
        @keyframes glow {
            0% { box-shadow: 0 0 5px rgba(0, 255, 204, 0.3); }
            100% { box-shadow: 0 0 20px rgba(0, 255, 204, 0.6); }
        }
        
        .playstyle-card.new {
            animation: glow 0.5s ease-in-out;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>League of Legends Analytics</h1>
        <div id="gameTime">00:00</div>
    </div>
    
    <div id="main">
        <div id="topSection">
            <div class="card">
                <h2>You</h2>
                <div class="stats">
                    <div class="stat">
                        <label>Champ</label>
                        <value id="pChamp">-</value>
                    </div>
                    <div class="stat">
                        <label>KDA</label>
                        <value id="pKDA">0/0/0</value>
                    </div>
                    <div class="stat">
                        <label>Lvl</label>
                        <value id="pLvl">0</value>
                    </div>
                    <div class="stat">
                        <label>CS</label>
                        <value id="pCS">0</value>
                    </div>
                </div>
                <div id="playstyleContainer">
                    <div class="playstyle-card">
                        <div class="playstyle-label">PLAYSTYLE</div>
                        <div class="playstyle-value" id="playstyleValue">-</div>
                        <div class="playstyle-confidence" id="playstyleConfidence">confidence: <span>0%</span></div>
                    </div>
                </div>
            </div>
            
            <div class="card enemy">
                <h2>Enemy</h2>
                <div class="stats">
                    <div class="stat enemy">
                        <label>Champ</label>
                        <value id="oChamp">-</value>
                    </div>
                    <div class="stat enemy">
                        <label>KDA</label>
                        <value id="oKDA">0/0/0</value>
                    </div>
                    <div class="stat enemy">
                        <label>Lvl</label>
                        <value id="oLvl">0</value>
                    </div>
                    <div class="stat enemy">
                        <label>CS</label>
                        <value id="oCS">0</value>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="chartsContainer"></div>
    </div>

    <script>
        const metrics = [
            { id: 'gold', label: 'Gold', metric: 'totalGold', color: ['#FFD700', '#FF6347'] },
            { id: 'cs', label: 'CS', metric: 'cs', color: ['#00BFFF', '#DC143C'] },
            { id: 'level', label: 'Level', metric: 'level', color: ['#00FF00', '#FF1493'] },
            { id: 'kills', label: 'Kills', metric: 'kills', color: ['#32CD32', '#FF4444'] },
            { id: 'xpdiff', label: 'XP Diff', metric: 'xpDiff', color: ['#FFD700', '#FF6B35'] }
        ];

        let charts = {};
        let data = {};
        let lastPlaystyle = '';

        function initCharts() {
            const container = document.getElementById('chartsContainer');
            metrics.forEach(m => {
                const box = document.createElement('div');
                box.className = 'chart-box';
                box.innerHTML = `<h3>${m.label}</h3><canvas id="c-${m.id}"></canvas>`;
                container.appendChild(box);
                
                data[m.id] = { labels: [], p: [], o: [] };
                
                const ctx = document.getElementById(`c-${m.id}`).getContext('2d');
                charts[m.id] = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data[m.id].labels,
                        datasets: [
                            { label: 'You', data: data[m.id].p, borderColor: m.color[0], backgroundColor: m.color[0] + '20', borderWidth: 1.5, tension: 0.3, fill: true, pointRadius: 1 },
                            { label: 'Enemy', data: data[m.id].o, borderColor: m.color[1], backgroundColor: m.color[1] + '20', borderWidth: 1.5, tension: 0.3, fill: true, pointRadius: 1 }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: { legend: { display: true, labels: { color: '#0a9fff', font: { size: 9 } } } },
                        scales: { y: { beginAtZero: true, grid: { color: 'rgba(10, 95, 150, 0.1)' }, ticks: { color: '#888', font: { size: 8 } } }, x: { grid: { color: 'rgba(10, 95, 150, 0.1)' }, ticks: { color: '#888', font: { size: 8 } } } },
                        animation: { duration: 0 }
                    }
                });
            });
        }

        function updatePlaystyleDisplay(mlPrediction) {
            if (!mlPrediction || !mlPrediction.style) {
                return;
            }
            
            const styleValue = document.getElementById('playstyleValue');
            const confidenceElem = document.getElementById('playstyleConfidence');
            const confidenceSpan = confidenceElem.querySelector('span');
            const playstyleCard = document.querySelector('.playstyle-card');
            
            if (mlPrediction.style !== lastPlaystyle) {
                playstyleCard.classList.remove('new');
                void playstyleCard.offsetWidth;
                playstyleCard.classList.add('new');
                lastPlaystyle = mlPrediction.style;
            }
            
            styleValue.textContent = mlPrediction.style;
            confidenceSpan.textContent = Math.round(mlPrediction.confidence * 100) + '%';
            
            let color = '#00ffcc';
            if (mlPrediction.confidence > 0.7) {
                color = '#00ff66';
            } else if (mlPrediction.confidence < 0.4) {
                color = '#ffaa00';
            }
            
            styleValue.style.color = color;
            styleValue.style.textShadow = `0 0 10px ${color}80`;
        }

        function formatTime(s) {
            const m = Math.floor(s / 60);
            return `${m}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
        }

        function updateData(payload) {
            const time = formatTime(payload.player.gameTime);
            const p = payload.player;
            const o = payload.opponent;

            document.getElementById('gameTime').textContent = time;
            document.getElementById('pChamp').textContent = p.champion || '-';
            document.getElementById('pKDA').textContent = `${p.kills}/${p.deaths}/${p.assists}`;
            document.getElementById('pLvl').textContent = p.level;
            document.getElementById('pCS').textContent = p.cs;
            
            document.getElementById('oChamp').textContent = o.champion || '-';
            document.getElementById('oKDA').textContent = `${o.kills}/${o.deaths}/${o.assists}`;
            document.getElementById('oLvl').textContent = o.level;
            document.getElementById('oCS').textContent = o.cs;

            if (payload.mlPrediction) {
                updatePlaystyleDisplay(payload.mlPrediction);
            }

            metrics.forEach(m => {
                const pVal = p[m.metric] || 0;
                const oVal = o[m.metric] || 0;
                
                data[m.id].labels.push(time);
                data[m.id].p.push(pVal);
                data[m.id].o.push(oVal);
                
                if (data[m.id].labels.length > 60) {
                    data[m.id].labels.shift();
                    data[m.id].p.shift();
                    data[m.id].o.shift();
                }
                
                charts[m.id].data.labels = [...data[m.id].labels];
                charts[m.id].data.datasets[0].data = [...data[m.id].p];
                charts[m.id].data.datasets[1].data = [...data[m.id].o];
                charts[m.id].update('none');
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM loaded, initializing charts...');
            initCharts();
            
            console.log('Connecting WebSocket...');
            const ws = new WebSocket("ws://" + window.location.host + "/ws");
            
            ws.onopen = () => console.log('WebSocket connected');
            ws.onmessage = (e) => {
                try {
                    const payload = JSON.parse(e.data);
                    updateData(payload);
                } catch (err) {
                    console.error('Error:', err);
                }
            };
            ws.onerror = (err) => console.error('WS Error:', err);
        });
    </script>
</body>
</html>
